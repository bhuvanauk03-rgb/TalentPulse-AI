name: TalentPulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate frontend files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          echo "All required TalentPulse frontend files are present."

      - name: Validate JavaScript
        run: |
          node --check app.js
          echo "JavaScript syntax validation successful."

      - name: Build validation successful
        run: echo "TalentPulse AI CI pipeline completed successfully."
